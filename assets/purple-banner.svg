<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Priyansh Chauhan, Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0614"/><stop offset=".55" stop-color="#150a2e"/><stop offset="1" stop-color="#07050f"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity=".12"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="orb1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#c6ff3d" stop-opacity=".22"/><stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1280" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#grid)"/>
    <circle cx="1060" cy="40" r="260" fill="url(#orb1)"><animate attributeName="cx" values="1060;1010;1060" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="290" r="230" fill="url(#orb2)"><animate attributeName="cy" values="290;260;290" dur="11s" repeatCount="indefinite"/></circle>

    <g stroke="#a855f7" stroke-opacity=".35" stroke-width="1.2" fill="none">
      <path d="M80 70 L170 120 L250 60 L330 130"><animate attributeName="stroke-opacity" values=".15;.5;.15" dur="4s" repeatCount="indefinite"/></path>
      <path d="M950 230 L1040 180 L1120 240 L1200 170"><animate attributeName="stroke-opacity" values=".5;.15;.5" dur="5s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#c084fc">
      <circle cx="80" cy="70" r="4"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="120" r="4"><animate attributeName="r" values="5;3;5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="60" r="4"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="130" r="4"><animate attributeName="r" values="5;3;5" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="230" r="4"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="180" r="4"><animate attributeName="r" values="5;3;5" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="240" r="4"><animate attributeName="r" values="3;5;3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="170" r="4"><animate attributeName="r" values="5;3;5" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="0" width="1280" height="2" fill="#c6ff3d" opacity=".5"><animate attributeName="y" values="0;300;0" dur="7s" repeatCount="indefinite"/></rect>

    <text x="640" y="120" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, Consolas, Menlo, monospace" font-size="56" font-weight="800" letter-spacing="6" fill="url(#tx)" filter="url(#glow)">PRIYANSH CHAUHAN</text>
    <text x="640" y="168" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, Consolas, Menlo, monospace" font-size="24" letter-spacing="10" fill="#c6ff3d">SOFTWARE DEVELOPER</text>
    <text x="640" y="214" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, Consolas, Menlo, monospace" font-size="15" letter-spacing="4" fill="#d8c8ff">FINTECH BACKEND  •  UPI &amp; PAYMENTS  •  FULL-STACK ML</text>
    <g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="15" fill="#a855f7">
      <text x="64" y="268">&lt;/&gt;</text><text x="1216" y="268" text-anchor="end">build. debug. ship.<tspan fill="#c6ff3d"> _</tspan></text>
    </g>
    <rect x="1" y="1" width="1278" height="298" rx="14" fill="none" stroke="#8b5cf6" stroke-opacity=".5"/>
  </g>
</svg>
