<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Animated terminal window showing a developer typing commands">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0614"/><stop offset="1" stop-color="#1a0d36"/></linearGradient>
    <style>
      .m{font:13px Consolas,Menlo,monospace;fill:#ddd6fe}
      .p{fill:#c6ff3d}.v{fill:#c084fc}.d{fill:#8b7fb5}
      .ln{opacity:0;animation:show 12s infinite}
      @keyframes show{0%,2%{opacity:0}5%,92%{opacity:1}100%{opacity:0}}
      .c1{animation-delay:0s}.c2{animation-delay:.9s}.c3{animation-delay:1.8s}.c4{animation-delay:2.7s}.c5{animation-delay:3.6s}.c6{animation-delay:4.5s}.c7{animation-delay:5.4s}
      .cur{animation:b 1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="520" height="300" rx="14" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity=".6"/>
  <rect width="520" height="34" rx="14" fill="#241247"/><rect y="20" width="520" height="14" fill="#241247"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="260" y="22" text-anchor="middle" class="m d" style="font-size:12px">priyansh@dev: ~</text>
  <g class="m">
    <text x="22" y="66" class="ln c1"><tspan class="p">$</tspan> whoami</text>
    <text x="22" y="86" class="ln c2 v">priyansh_chauhan</text>
    <text x="22" y="116" class="ln c3"><tspan class="p">$</tspan> cat stack.txt</text>
    <text x="22" y="136" class="ln c4 v">java  spring-boot  php  mysql</text>
    <text x="22" y="156" class="ln c4 v">python  fastapi  react  docker</text>
    <text x="22" y="186" class="ln c5"><tspan class="p">$</tspan> ./ship --env prod</text>
    <text x="22" y="206" class="ln c6 d">✔ tests passed  (150+)</text>
    <text x="22" y="226" class="ln c6 d">✔ queries optimised  (-40%)</text>
    <text x="22" y="256" class="ln c7"><tspan class="p">$</tspan> <tspan class="cur">▌</tspan></text>
  </g>
</svg>
