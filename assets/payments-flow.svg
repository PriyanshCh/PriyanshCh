<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="P2PM merchant onboarding flow: merchant request to backend to Yes Bank APIs to callback to MySQL to MIS reports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0614"/><stop offset="1" stop-color="#150a2e"/></linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c6ff3d"/></marker>
    <style>
      .n{fill:#120a26;stroke:#8b5cf6;stroke-width:1.5}
      .hot{stroke:#c6ff3d}
      .t{font:600 15px Consolas,Menlo,monospace;fill:#ede9fe;text-anchor:middle}
      .s{font:12px Consolas,Menlo,monospace;fill:#a78bfa;text-anchor:middle}
      .l{stroke:#c6ff3d;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#ar);animation:d 1s linear infinite}
      @keyframes d{to{stroke-dashoffset:-26}}
    </style>
  </defs>
  <rect width="1100" height="250" rx="14" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity=".5"/>
  <text x="550" y="34" class="t" style="font-size:13px;fill:#c6ff3d;letter-spacing:3px">P2PM ONBOARDING · MERCHANT → VPA</text>
  <rect class="n" x="30" y="70" width="150" height="62" rx="10"/><text class="t" x="105" y="98">Merchant</text><text class="s" x="105" y="118">onboarding request</text>
  <rect class="n hot" x="235" y="70" width="170" height="62" rx="10"/><text class="t" x="320" y="98">Backend</text><text class="s" x="320" y="118">validation · queue</text>
  <rect class="n" x="460" y="70" width="190" height="62" rx="10"/><text class="t" x="555" y="98">Bank APIs</text><text class="s" x="555" y="118">seller → terminal → VPA</text>
  <rect class="n" x="705" y="70" width="170" height="62" rx="10"/><text class="t" x="790" y="98">Callback</text><text class="s" x="790" y="118">JWT sig · decrypt</text>
  <rect class="n" x="930" y="70" width="140" height="62" rx="10"/><text class="t" x="1000" y="98">MySQL</text><text class="s" x="1000" y="118">persist + status</text>
  <path class="l" d="M180 101H233"/><path class="l" d="M405 101H458"/><path class="l" d="M650 101H703"/><path class="l" d="M875 101H928"/>
  <rect class="n" x="235" y="170" width="170" height="52" rx="10"/><text class="t" x="320" y="193">Error log</text><text class="s" x="320" y="211">failures · queue status</text>
  <rect class="n" x="930" y="170" width="140" height="52" rx="10"/><text class="t" x="1000" y="193">MIS reports</text><text class="s" x="1000" y="211">recon · RBI</text>
  <path class="l" d="M320 132V168"/><path class="l" d="M1000 132V168"/>
</svg>
